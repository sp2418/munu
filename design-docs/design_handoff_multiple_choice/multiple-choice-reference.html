<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuNu · Multiple-choice question — design reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400..600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ════════════════════════════════════════════════════════════
     MuNu · MULTIPLE-CHOICE QUESTION (multi-select) — reusable.
     "Genres" is one instance; this same screen is used for every
     multi-select question in the flow. DESIGN REFERENCE — recreate
     in your own stack as a single reusable component.
     ════════════════════════════════════════════════════════════ */
  :root {
    --cream:#f8f4ec; --ink:#39322a; --ink-muted:#6f675b; --ink-faint:#9a9387;
    /* Accent token set — default Lilac (swap all six together to re-hue) */
    --fill:#c2b0cf; --on-fill:#3d3147; --accent-text:#6b5878; --tint:#d6cbdd;
    --fill-rgb:107,84,120; --bloom-rgb:194,176,207;
    --serif:'Lora',Georgia,serif; --sans:'Hanken Grotesk',system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { min-height:100vh; display:flex; background:var(--cream); }

  .screen {
    position:relative; overflow:hidden; flex:1; min-height:100vh;
    display:flex; flex-direction:column;
    color:var(--ink); font-family:var(--serif); -webkit-font-smoothing:antialiased;
  }

  /* ambient bloom + breathing ripple (quieter than the Welcome's emanation) */
  .screen__bloom {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:720px; height:600px; pointer-events:none; z-index:0;
    background:radial-gradient(closest-side, rgba(var(--bloom-rgb),0.18), rgba(var(--bloom-rgb),0.06) 50%, rgba(248,244,236,0) 78%);
  }
  .screen__rings { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .screen__rings span {
    position:absolute; left:50%; top:50%; border-radius:50%;
    border:1.5px solid rgba(var(--fill-rgb),0.13);
    animation:breathe 7.5s ease-in-out infinite;
  }
  .screen__rings span:nth-child(1){ width:250px;height:250px; border-color:rgba(var(--fill-rgb),0.15); animation-delay:0s; }
  .screen__rings span:nth-child(2){ width:470px;height:470px; border-color:rgba(var(--fill-rgb),0.11); animation-delay:.5s; }
  .screen__rings span:nth-child(3){ width:710px;height:710px; border-color:rgba(var(--fill-rgb),0.075); animation-delay:1s; }
  .screen__rings span:nth-child(4){ width:970px;height:970px; border-color:rgba(var(--fill-rgb),0.05); animation-delay:1.5s; }
  .screen__rings span:nth-child(5){ width:1250px;height:1250px; border-color:rgba(var(--fill-rgb),0.03); animation-delay:2s; }
  @keyframes breathe {
    0%,100% { transform:translate(-50%,-50%) scale(1); }
    50%     { transform:translate(-50%,-50%) scale(1.035); }
  }

  /* step counter, top-right */
  .step {
    position:absolute; top:40px; right:48px; z-index:2; width:max-content; white-space:nowrap;
    font-family:var(--sans); font-size:14px; font-weight:500; letter-spacing:.01em; color:var(--ink-faint);
  }
  .step b { color:var(--accent-text); font-weight:600; }

  /* two-column layout: question/hint left, options right */
  .layout {
    position:relative; z-index:1; flex:1; box-sizing:border-box;
    display:grid; grid-template-columns:0.85fr 1.15fr; gap:64px; align-items:center; padding:76px 64px 24px;
  }

  /* flow nav — shared chrome (Back / Continue) */
  .footer {
    position:relative; z-index:1; box-sizing:border-box;
    display:flex; align-items:center; justify-content:space-between; padding:0 64px 48px;
  }
  .btn-ghost {
    font-family:var(--sans); font-size:15px; font-weight:500; cursor:pointer; white-space:nowrap;
    color:var(--accent-text); background:none;
    padding:12px 28px; border-radius:999px; border:1.5px solid rgba(var(--fill-rgb),0.28);
    transition:background .2s, border-color .2s;
  }
  .btn-ghost:hover { background:rgba(var(--fill-rgb),0.07); border-color:rgba(var(--fill-rgb),0.5); }
  .btn-primary {
    font-family:var(--sans); font-size:16px; font-weight:600; letter-spacing:.01em; cursor:pointer;
    white-space:nowrap; border:none; color:var(--on-fill); background:var(--fill);
    padding:15px 40px; border-radius:999px;
    box-shadow:0 2px 6px -2px rgba(var(--fill-rgb),0.35), 0 12px 28px -12px rgba(var(--fill-rgb),0.45);
    transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s, filter .2s;
  }
  .btn-primary:hover { transform:translateY(-2px); filter:brightness(1.05); }
  .q {
    font-family:var(--serif); font-size:30px; line-height:1.34; font-weight:500;
    letter-spacing:-.008em; color:var(--ink); margin:0; text-wrap:pretty; max-width:12em;
  }
  .hint {
    font-family:var(--sans); font-size:15px; line-height:1.6; color:var(--ink-muted);
    margin:16px 0 0; max-width:23em;
  }

  /* option grid — wraps; here shown as a 4-column max-content grid */
  .options { display:grid; grid-template-columns:repeat(4, max-content); gap:13px 15px; justify-content:start; }
  .chip {
    font-family:var(--sans); font-size:15px; font-weight:500; white-space:nowrap; text-align:center; cursor:pointer;
    color:#5b5247; background:rgba(255,255,255,0.5);
    padding:12px 22px; border-radius:999px; border:1.5px solid rgba(33,29,23,0.13);
    transition:background .18s, border-color .18s, color .18s, transform .18s;
  }
  .chip:hover { border-color:var(--tint); color:var(--accent-text); transform:translateY(-1px); }
  .chip[aria-pressed="true"] {
    color:var(--on-fill); background:var(--fill); border-color:var(--fill);
    box-shadow:0 3px 10px -4px rgba(var(--fill-rgb),0.5);
  }
  .chip[aria-pressed="true"]:hover { transform:translateY(-1px); color:var(--on-fill); }

  @media (prefers-reduced-motion: reduce) {
    .screen__rings span { animation:none; }
  }
</style>
</head>
<body>
  <main class="screen">
    <div class="screen__bloom"></div>
    <div class="screen__rings"><span></span><span></span><span></span><span></span><span></span></div>

    <!-- step counter: bold number = current question index -->
    <div class="step">Question <b>1</b> of 5</div>

    <div class="layout">
      <div class="q-col">
        <!-- QUESTION (varies per step) -->
        <h2 class="q">What are your favorite genres of music?</h2>
        <!-- optional helper line -->
        <p class="hint">Pick as many as feel like you — there are no wrong answers.</p>
      </div>

      <!-- OPTIONS: each is a toggle button. aria-pressed reflects selection. -->
      <div class="options" id="options" role="group" aria-label="Favorite genres">
        <!-- rendered from data; preselected = aria-pressed="true" -->
      </div>
    </div>

    <!-- Flow navigation. Back is quiet; Continue is the primary pebble.
         Continue is enabled here; gate on min-selection if the step requires it. -->
    <div class="footer">
      <button class="btn-ghost" type="button">Back</button>
      <button class="btn-primary" type="button">Continue</button>
    </div>
  </main>

  <script>
    // The options + which start selected are DATA — the component is generic.
    var OPTIONS = ["Hip Hop","R&B","Pop","Rock","Indie","Jazz","Classical","Electronic",
      "Latin","Afrobeats","Country","Metal","Folk","Gospel","Reggae","Blues",
      "Soul","Punk","Alternative","Dance"];
    var selected = new Set(["R&B","Pop","Indie"]);

    var wrap = document.getElementById('options');
    OPTIONS.forEach(function (label) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('aria-pressed', selected.has(label) ? 'true' : 'false');
      b.addEventListener('click', function () {
        var on = b.getAttribute('aria-pressed') === 'true';
        b.setAttribute('aria-pressed', on ? 'false' : 'true');
      });
      wrap.appendChild(b);
    });
  </script>
</body>
</html>
