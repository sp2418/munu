<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuNu · Search-picker question — design reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400..600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ════════════════════════════════════════════════════════════
     MuNu · SEARCH-PICKER QUESTION (search + scrollable picks).
     "Favorite artists" is one instance; the same screen is used for
     EVERY question of this format (search a list, add results, see
     chosen items as removable cards in a scrollable side column).
     RESTYLE REFERENCE: apply these visuals to the EXISTING, working
     component — don't rebuild the search/state logic.
     ════════════════════════════════════════════════════════════ */
  :root {
    --cream:#f8f4ec; --ink:#39322a; --ink-muted:#6f675b; --ink-faint:#9a9387;
    /* Accent token set — default Lilac (swap all six together to re-hue) */
    --fill:#c2b0cf; --on-fill:#3d3147; --accent-text:#6b5878; --tint:#d6cbdd;
    --fill-rgb:107,84,120; --bloom-rgb:194,176,207;
    --serif:'Lora',Georgia,serif; --sans:'Hanken Grotesk',system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { min-height:100vh; display:flex; background:var(--cream); }

  .screen {
    position:relative; overflow:hidden; flex:1; min-height:100vh;
    display:flex; flex-direction:column;
    color:var(--ink); font-family:var(--serif); -webkit-font-smoothing:antialiased;
  }

  /* ambient bloom + breathing ripple */
  .screen__bloom {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:720px; height:600px; pointer-events:none; z-index:0;
    background:radial-gradient(closest-side, rgba(var(--bloom-rgb),0.18), rgba(var(--bloom-rgb),0.06) 50%, rgba(248,244,236,0) 78%);
  }
  .screen__rings { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .screen__rings span {
    position:absolute; left:50%; top:50%; border-radius:50%;
    border:1.5px solid rgba(var(--fill-rgb),0.13); animation:breathe 7.5s ease-in-out infinite;
  }
  .screen__rings span:nth-child(1){ width:250px;height:250px; border-color:rgba(var(--fill-rgb),0.15); animation-delay:0s; }
  .screen__rings span:nth-child(2){ width:470px;height:470px; border-color:rgba(var(--fill-rgb),0.11); animation-delay:.5s; }
  .screen__rings span:nth-child(3){ width:710px;height:710px; border-color:rgba(var(--fill-rgb),0.075); animation-delay:1s; }
  .screen__rings span:nth-child(4){ width:970px;height:970px; border-color:rgba(var(--fill-rgb),0.05); animation-delay:1.5s; }
  .screen__rings span:nth-child(5){ width:1250px;height:1250px; border-color:rgba(var(--fill-rgb),0.03); animation-delay:2s; }
  @keyframes breathe { 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.035);} }

  .step {
    position:absolute; top:40px; right:48px; z-index:2; width:max-content; white-space:nowrap;
    font-family:var(--sans); font-size:14px; font-weight:500; letter-spacing:.01em; color:var(--ink-faint);
  }
  .step b { color:var(--accent-text); font-weight:600; }

  /* body: question + search (left, TOP-ALIGNED), scrollable picks (right) */
  .top {
    position:relative; z-index:1; flex:1; min-height:0;
    display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:start; padding:84px 64px 0;
  }
  .q {
    font-family:var(--serif); font-size:30px; line-height:1.34; font-weight:500;
    letter-spacing:-.008em; color:var(--ink); margin:0; text-wrap:pretty; max-width:12em;
  }

  .searchwrap { position:relative; margin-top:24px; max-width:460px; }
  .search {
    display:flex; align-items:center; gap:12px; padding:14px 22px; border-radius:999px;
    background:rgba(255,255,255,0.6); border:1.5px solid rgba(33,29,23,0.13);
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .search:focus-within { border-color:rgba(var(--fill-rgb),0.45); background:rgba(255,255,255,0.85); box-shadow:0 0 0 4px rgba(var(--fill-rgb),0.08); }
  .search svg { width:19px; height:19px; color:var(--ink-faint); flex:none; }
  .search input { border:none; background:none; outline:none; width:100%; font-family:var(--sans); font-size:16px; color:var(--ink); }
  .search input::placeholder { color:var(--ink-faint); }

  /* dropdown of matches — overlays the space the raised question freed up */
  .dropdown {
    position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:6;
    list-style:none; margin:0; padding:6px; max-height:360px; overflow-y:auto;
    background:#fdfbf6; border:1.5px solid rgba(33,29,23,0.1); border-radius:16px;
    box-shadow:0 22px 48px -22px rgba(33,29,23,0.5);
  }
  .opt {
    display:block; width:100%; text-align:left; cursor:pointer;
    font-family:var(--serif); font-size:18px; color:var(--ink);
    padding:12px 18px; border:none; background:none; border-radius:10px; transition:background .15s, color .15s;
  }
  .opt:hover { background:rgba(var(--fill-rgb),0.12); color:var(--accent-text); }

  /* right: scrollable column of chosen items */
  .picks {
    align-self:stretch; min-height:0; overflow-y:auto;
    display:flex; flex-direction:column; align-items:center; gap:18px; padding:4px 6px 16px;
  }
  .empty { font-family:var(--serif); font-style:italic; font-size:16px; color:var(--ink-faint); margin:40px 0 0; text-align:center; max-width:18em; }
  .card { position:relative; flex:none; width:270px; border-radius:16px; overflow:hidden; box-shadow:0 12px 30px -16px rgba(33,29,23,0.55); }
  .card__img { width:270px; height:290px; background:linear-gradient(150deg,#cdc7bd,#9b948a); display:block; }
  .card__x {
    position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,0.88); color:var(--ink); cursor:pointer; border:none;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px -2px rgba(33,29,23,0.4);
    transition:background .2s, transform .2s;
  }
  .card__x:hover { background:#fff; transform:scale(1.06); }
  .card__x svg { width:15px; height:15px; }
  .card__name {
    position:absolute; left:0; right:0; bottom:0; padding:24px 14px 10px;
    font-family:var(--sans); font-size:14px; font-weight:600; color:#fff; text-align:left;
    background:linear-gradient(180deg, transparent, rgba(20,16,12,0.66));
  }

  /* footer nav */
  .footer { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; padding:16px 64px 40px; }
  .btn-ghost {
    font-family:var(--sans); font-size:15px; font-weight:500; cursor:pointer; white-space:nowrap;
    color:var(--accent-text); background:none; padding:12px 28px; border-radius:999px;
    border:1.5px solid rgba(var(--fill-rgb),0.28); transition:background .2s, border-color .2s;
  }
  .btn-ghost:hover { background:rgba(var(--fill-rgb),0.07); border-color:rgba(var(--fill-rgb),0.5); }
  .btn-primary {
    font-family:var(--sans); font-size:16px; font-weight:600; letter-spacing:.01em; cursor:pointer;
    white-space:nowrap; border:none; color:var(--on-fill); background:var(--fill);
    padding:15px 40px; border-radius:999px;
    box-shadow:0 2px 6px -2px rgba(var(--fill-rgb),0.35), 0 12px 28px -12px rgba(var(--fill-rgb),0.45);
    transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s, filter .2s;
  }
  .btn-primary:hover { transform:translateY(-2px); filter:brightness(1.05); }

  @media (prefers-reduced-motion: reduce) { .screen__rings span { animation:none; } }
</style>
</head>
<body>
  <main class="screen">
    <div class="screen__bloom"></div>
    <div class="screen__rings"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="step">Question <b>2</b> of 5</div>

    <div class="top">
      <div class="left">
        <h2 class="q">Who are your favorite artists?</h2>
        <div class="searchwrap">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="q" type="text" placeholder="Search for an artist…" autocomplete="off">
          </div>
          <ul class="dropdown" id="dropdown" hidden></ul>
        </div>
      </div>
      <div class="picks" id="picks"></div>
    </div>

    <div class="footer">
      <button class="btn-ghost" type="button">Back</button>
      <button class="btn-primary" type="button">Next</button>
    </div>
  </main>

  <script>
    // The searchable list + which start chosen are DATA — the screen is generic.
    var ALL = ["Rihanna","Michael Jackson","Beyoncé","Nicki Minaj","Sia","Drake","Olivia Dean",
      "Frank Ocean","Mitski","H.E.R.","Steve Lacy","SZA","Lana Del Rey","Tyler, the Creator",
      "Caroline Polachek","Sufjan Stevens","Solange","Sampha","Arlo Parks","Cleo Sol"];
    var selected = ["Beyoncé"];

    var input = document.getElementById('q');
    var dropdown = document.getElementById('dropdown');
    var picks = document.getElementById('picks');

    function results() {
      var qv = input.value.trim().toLowerCase();
      var list = qv ? ALL.filter(function(a){ return a.toLowerCase().indexOf(qv) > -1; }) : ALL;
      return list.filter(function(a){ return selected.indexOf(a) === -1; });
    }
    function renderDropdown(open) {
      var r = results();
      if (!open || r.length === 0) { dropdown.hidden = true; dropdown.innerHTML=''; return; }
      dropdown.hidden = false;
      dropdown.innerHTML = r.map(function(name){
        return '<li><button class="opt" data-name="'+name+'">'+name+'</button></li>';
      }).join('');
    }
    function renderPicks() {
      if (selected.length === 0) { picks.innerHTML = '<p class="empty">The artists you pick will gather here.</p>'; return; }
      picks.innerHTML = selected.map(function(name){
        return '<div class="card"><span class="card__img"></span>'
          + '<button class="card__x" data-remove="'+name+'" aria-label="Remove '+name+'">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>'
          + '<span class="card__name">'+name+'</span></div>';
      }).join('');
    }

    input.addEventListener('input', function(){ renderDropdown(true); });
    input.addEventListener('focus', function(){ renderDropdown(true); });
    input.addEventListener('blur', function(){ setTimeout(function(){ renderDropdown(false); }, 150); });
    dropdown.addEventListener('mousedown', function(e){
      var b = e.target.closest('.opt'); if(!b) return; e.preventDefault();
      selected.push(b.dataset.name); input.value=''; renderPicks(); renderDropdown(true); input.focus();
    });
    picks.addEventListener('click', function(e){
      var b = e.target.closest('.card__x'); if(!b) return;
      selected = selected.filter(function(n){ return n !== b.dataset.remove; });
      renderPicks(); renderDropdown(!dropdown.hidden);
    });

    renderPicks();
  </script>
</body>
</html>
