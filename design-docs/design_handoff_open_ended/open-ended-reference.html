<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuNu · Open-ended question — design reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400..600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ════════════════════════════════════════════════════════════
     MuNu · OPEN-ENDED QUESTION (free text) — reusable.
     "Reflection" is one instance; the same screen is used for every
     free-text question in the flow. RESTYLE REFERENCE: apply these
     visuals to the EXISTING, working component — don't rebuild logic.
     ════════════════════════════════════════════════════════════ */
  :root {
    --cream:#f8f4ec; --ink:#39322a; --ink-muted:#6f675b; --ink-faint:#9a9387;
    /* Accent token set — default Lilac (swap all six together to re-hue) */
    --fill:#c2b0cf; --on-fill:#3d3147; --accent-text:#6b5878; --tint:#d6cbdd;
    --fill-rgb:107,84,120; --bloom-rgb:194,176,207;
    --serif:'Lora',Georgia,serif; --sans:'Hanken Grotesk',system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { min-height:100vh; display:flex; background:var(--cream); }

  .screen {
    position:relative; overflow:hidden; flex:1; min-height:100vh;
    display:flex; flex-direction:column;
    color:var(--ink); font-family:var(--serif); -webkit-font-smoothing:antialiased;
  }

  /* ambient bloom + breathing ripple (same calm motif as the other screens) */
  .screen__bloom {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:720px; height:600px; pointer-events:none; z-index:0;
    background:radial-gradient(closest-side, rgba(var(--bloom-rgb),0.18), rgba(var(--bloom-rgb),0.06) 50%, rgba(248,244,236,0) 78%);
  }
  .screen__rings { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .screen__rings span {
    position:absolute; left:50%; top:50%; border-radius:50%;
    border:1.5px solid rgba(var(--fill-rgb),0.13);
    animation:breathe 7.5s ease-in-out infinite;
  }
  .screen__rings span:nth-child(1){ width:250px;height:250px; border-color:rgba(var(--fill-rgb),0.15); animation-delay:0s; }
  .screen__rings span:nth-child(2){ width:470px;height:470px; border-color:rgba(var(--fill-rgb),0.11); animation-delay:.5s; }
  .screen__rings span:nth-child(3){ width:710px;height:710px; border-color:rgba(var(--fill-rgb),0.075); animation-delay:1s; }
  .screen__rings span:nth-child(4){ width:970px;height:970px; border-color:rgba(var(--fill-rgb),0.05); animation-delay:1.5s; }
  .screen__rings span:nth-child(5){ width:1250px;height:1250px; border-color:rgba(var(--fill-rgb),0.03); animation-delay:2s; }
  @keyframes breathe {
    0%,100% { transform:translate(-50%,-50%) scale(1); }
    50%     { transform:translate(-50%,-50%) scale(1.035); }
  }

  /* optional step counter (omit on the final/standalone question) */
  .step {
    position:absolute; top:40px; right:48px; z-index:2; width:max-content; white-space:nowrap;
    font-family:var(--sans); font-size:14px; font-weight:500; letter-spacing:.01em; color:var(--ink-faint);
  }
  .step b { color:var(--accent-text); font-weight:600; }

  /* body: question left, text field right */
  .body {
    position:relative; z-index:1; flex:1; box-sizing:border-box;
    display:grid; grid-template-columns:0.82fr 1.18fr; gap:56px; align-items:start;
    padding:72px 64px 24px;
  }
  .q-col { padding-top:6px; }
  .q {
    font-family:var(--serif); font-size:30px; line-height:1.34; font-weight:500;
    letter-spacing:-.008em; color:var(--ink); margin:0; text-wrap:pretty; max-width:12em;
  }

  /* the free-text field */
  .field {
    width:100%; box-sizing:border-box; resize:none; min-height:320px;
    font-family:var(--serif); font-size:18px; line-height:1.62; color:var(--ink);
    background:rgba(255,255,255,0.55);
    border:1.5px solid rgba(33,29,23,0.14); border-radius:18px; padding:22px 24px; outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .field::placeholder { color:var(--ink-faint); }
  .field:focus {
    border-color:rgba(var(--fill-rgb),0.45); background:rgba(255,255,255,0.78);
    box-shadow:0 0 0 4px rgba(var(--fill-rgb),0.08);
  }

  /* footer nav */
  .footer {
    position:relative; z-index:1; box-sizing:border-box;
    display:flex; align-items:center; justify-content:space-between; padding:0 64px 48px;
  }
  .btn-ghost {
    font-family:var(--sans); font-size:15px; font-weight:500; cursor:pointer; white-space:nowrap;
    color:var(--accent-text); background:none;
    padding:12px 28px; border-radius:999px; border:1.5px solid rgba(var(--fill-rgb),0.28);
    transition:background .2s, border-color .2s;
  }
  .btn-ghost:hover { background:rgba(var(--fill-rgb),0.07); border-color:rgba(var(--fill-rgb),0.5); }
  .btn-primary {
    font-family:var(--sans); font-size:16px; font-weight:600; letter-spacing:.01em; cursor:pointer;
    white-space:nowrap; border:none; color:var(--on-fill); background:var(--fill);
    padding:15px 40px; border-radius:999px;
    box-shadow:0 2px 6px -2px rgba(var(--fill-rgb),0.35), 0 12px 28px -12px rgba(var(--fill-rgb),0.45);
    transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s, filter .2s;
  }
  .btn-primary:hover { transform:translateY(-2px); filter:brightness(1.05); }

  @media (prefers-reduced-motion: reduce) {
    .screen__rings span { animation:none; }
  }
</style>
</head>
<body>
  <main class="screen">
    <div class="screen__bloom"></div>
    <div class="screen__rings"><span></span><span></span><span></span><span></span><span></span></div>

    <div class="body">
      <div class="q-col">
        <!-- QUESTION (varies per step) -->
        <h2 class="q">Is there anything else about your relationship with music you&rsquo;d want us to know?</h2>
      </div>
      <!-- FREE-TEXT FIELD: serif, generous, soft. Placeholder is example copy. -->
      <textarea class="field" placeholder="Music is honestly how I figure out what I'm feeling. I can be in a weird mood all day and not really know why, and then a song will come on and I'll go 'oh, that's what's going on.'"></textarea>
    </div>

    <!-- Flow nav. Primary label varies: "Done" on the last step, else "Continue". -->
    <div class="footer">
      <button class="btn-ghost" type="button">Back</button>
      <button class="btn-primary" type="button">Done</button>
    </div>
  </main>
</body>
</html>
